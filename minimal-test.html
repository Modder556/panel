<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Nostalgist minimal test</title></head>
<body style="font-family:monospace;background:#111;color:#ddd;padding:16px">

  <p>
    Core:
    <select id="core">
      <option>mame2003_plus</option>
      <option>fbneo</option>
      <option>fbalpha2012</option>
      <option>fceumm</option>
    </select>
    <input type="file" id="rom">
  </p>

  <canvas id="screen" width="768" height="576" style="width:768px;height:576px;background:#000"></canvas>
  <pre id="out" style="white-space:pre-wrap;color:#8f8"></pre>

<script type="module">
// Pinned on purpose — an unpinned CDN import is one more variable.
import { Nostalgist } from 'https://esm.run/nostalgist@0.21.1';

const out = document.getElementById('out');
const say = (m, c='#8f8') => {
  const d = document.createElement('div');
  d.style.color = c;
  d.textContent = m;
  out.appendChild(d);
};

say('Nostalgist loaded: ' + typeof Nostalgist);
say('launch is: ' + typeof Nostalgist.launch);

document.getElementById('rom').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  const core = document.getElementById('core').value;

  say(`--- launching core="${core}" rom="${file.name}" ---`);

  try {
    const n = await Nostalgist.launch({
      core,
      // MAME derives the driver shortname from the filename, so the name
      // has to survive the trip into the virtual filesystem. A bare File
      // lands as "data1.zip" and MAME looks up a driver called "data1".
      rom: { fileName: file.name, fileContent: file },
      element: document.getElementById('screen'),
      retroarchConfig: {
        log_verbosity: 'true',
        frontend_log_level: '0',
      },
      // Route RetroArch's own stdout/stderr somewhere visible. This is the
      // part that tells you WHY content failed, in RetroArch's own words.
      emscriptenModule: {
        print:    m => say(m, '#8cf'),
        printErr: m => say(m, '#f88'),
      },
    });
    window.n = n;   // poke at it from the console
    say('--- launch() resolved ---');
  } catch (err) {
    say('LAUNCH THREW: ' + err.message, '#f44');
    console.error(err);
  }
});
</script>
</body>
</html>
